<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Банк Хрустиков</title>
<meta name="theme-color" content="#ff901b" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="images/icon-192.png" />
<link rel="apple-touch-icon" href="images/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="welcome">

  <header class="topbar">
    <div class="topbar__logo">Банк Хрустиков</div>
    <div class="topbar__actions">
      <a class="btn btn-white btn--sm" href="index.html?screen=register">Регистрация</a>
      <a class="btn btn-blue btn--sm" href="index.html?screen=login">Войти</a>
    </div>
  </header>

  <section class="hero">
    <!-- разбросанные купюры, парят и слегка перекрывают друг друга -->
    <img class="bill bill-50"  src="images/50.png"  alt="Купюра 50 хрустиков"  onerror="this.style.display='none'">
    <img class="bill bill-67"  src="images/67.png"  alt="Купюра 67 хрустиков"  onerror="this.style.display='none'">
    <img class="bill bill-100" src="images/100.png" alt="Купюра 100 хрустиков" onerror="this.style.display='none'">
    <img class="bill bill-500" src="images/500.png" alt="Купюра 500 хрустиков" onerror="this.style.display='none'">

    <div class="hero__card">
      <p class="hero__title">Взгляд серьёзный, кот большой —<br>хрусти уверенно душой!</p>
      <div class="hero__actions">
        <a class="btn btn-white" href="index.html?screen=register">Регистрация</a>
        <a class="btn btn-blue" href="index.html?screen=login">Войти</a>
      </div>
    </div>
  </section>

</div>

</body>
</html>
